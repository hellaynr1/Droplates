<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Studio — Droplates</title>
<meta name="description" content="Customise a Droplates template and download it free.">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="bar">
  <a class="back" href="../templates/" aria-label="Back to templates"><img src="../logo-mark.png" alt="" width="18" height="18"><span>Studio</span></a>
  <p class="tname" id="tname">Loading…</p>
  <label class="sr" for="page-m">Page</label><select id="page-m" class="ctl mobile-only"></select>
  <button type="button" class="ib" id="undo" title="Undo (Ctrl/⌘+Z)" aria-label="Undo" disabled>↶</button>
  <button type="button" class="ib" id="redo" title="Redo (Ctrl/⌘+Shift+Z)" aria-label="Redo" disabled>↷</button>
  <div class="seg desk-only" role="group" aria-label="Preview size">
    <button type="button" data-w="100%" aria-pressed="true">Desktop</button><button type="button" data-w="820px" aria-pressed="false">Tablet</button><button type="button" data-w="390px" aria-pressed="false">Mobile</button>
  </div>
  <button type="button" class="ghost desk-only" id="full">Full screen</button>
  <div class="menu-wrap">
    <button type="button" class="ghost" id="drafts-btn" aria-haspopup="true" aria-expanded="false">Drafts<span class="desk-only"> ▾</span></button>
    <div class="menu" id="drafts" hidden>
      <p class="h">Drafts (saved in this browser)</p>
      <div id="draft-list" class="dlist"></div>
      <div class="mrow"><button type="button" class="ghost" id="draft-save">Save as…</button><button type="button" class="ghost" id="draft-export">Export JSON</button></div>
      <div class="mrow"><label class="ghost file">Import JSON<input type="file" id="draft-import" accept="application/json,.json" hidden></label><button type="button" class="ghost danger" id="reset">Reset to defaults</button></div>
    </div>
  </div>
  <button type="button" class="primary" id="download">Download<span class="desk-only"> free</span></button>
</header>
<div class="layout">
  <aside class="nav" id="navp" aria-label="Pages and sections">
    <div class="sheet-head"><b>Pages &amp; sections</b><button type="button" class="ghost close">Done</button></div>
    <p class="h">Pages</p><div id="pages" class="list"></div>
    <p class="h">Sections on this page</p><div id="sections" class="list"></div>
    <p class="hint">Click any outlined element in the preview to edit it.</p>
  </aside>
  <main class="stage" id="stage"><iframe id="frame" title="Template preview"></iframe></main>
  <aside class="ins" id="insp" aria-label="Inspector">
    <div class="sheet-head"><b>Customise</b><button type="button" class="ghost close">Done</button></div>
    <div class="tabs" role="tablist" aria-label="Inspector">
      <button role="tab" type="button" data-tab="element" aria-selected="true">Element</button>
      <button role="tab" type="button" data-tab="style" aria-selected="false">Style</button>
      <button role="tab" type="button" data-tab="brand" aria-selected="false">Brand</button>
      <button role="tab" type="button" data-tab="settings" aria-selected="false">Settings</button>
    </div>
    <div class="tp" data-panel="element" id="p-element"></div>
    <div class="tp" data-panel="style" id="p-style" hidden></div>
    <div class="tp" data-panel="brand" id="p-brand" hidden></div>
    <div class="tp" data-panel="settings" id="p-settings" hidden></div>
  </aside>
</div>
<nav class="tabbar mobile-only" aria-label="Studio">
  <button type="button" data-m="navp">Pages</button><button type="button" data-m="element">Element</button><button type="button" data-m="style">Style</button><button type="button" data-m="brand">Brand</button><button type="button" data-m="settings">More</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="studio.js"></script>
</body>
</html>
