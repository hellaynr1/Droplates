<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waitlist — Guidify</title>
  <meta name="description" content="Join the Guidify waitlist.">
  <style>
    :root { --bg:#000; --surface:#0b0b0b; --line:#1f1f1f; --text:#f5f5f5; --muted:#8a8a8a; --radius:14px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:1120px; margin:0 auto; padding:0 16px; width:100%; }
    header { border-bottom:1px solid var(--line); }
    .nav { display:flex; align-items:center; justify-content:space-between; height:64px; }
    .wordmark { display:inline-flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-0.02em; font-size:1.125rem; }
    .wordmark img { width:28px; height:28px; display:block; border-radius:6px; }
    .back { font-size:0.875rem; color:var(--muted); }
    .back:hover { color:var(--text); }
    main { flex:1; display:flex; align-items:center; }
    .panel { text-align:center; max-width:560px; margin:0 auto; padding:96px 0; width:100%; }
    .eyebrow { display:inline-block; font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:6px 14px; margin-bottom:28px; }
    h1 { font-size:clamp(2.25rem,6vw,3.5rem); line-height:1.05; letter-spacing:-0.04em; font-weight:700; margin-bottom:20px; }
    .lede { color:var(--muted); font-size:1.0625rem; margin-bottom:40px; }
    form { display:flex; gap:8px; max-width:480px; margin:0 auto; }
    input { flex:1; min-width:0; height:48px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:0.9375rem; }
    input::placeholder { color:#555; }
    input:focus { outline:1px solid #444; }
    .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 22px; border-radius:999px; background:#fff; color:#000; font-weight:600; font-size:0.9375rem; border:none; cursor:pointer; white-space:nowrap; }
    .btn:hover { opacity:0.88; }
    .fine { margin-top:16px; font-size:0.8125rem; color:#666; }
    .placeholder { color:#c9a227; }
    footer { border-top:1px solid var(--line); padding:32px 0; font-size:0.8125rem; color:#666; }
    @media (max-width:640px) { .panel { padding:72px 0; } form { flex-direction:column; } input { flex:none; width:100%; } .btn { width:100%; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a href="index.html" class="wordmark"><img src="assets/guidify-logo.png" alt="Guidify logo">Guidify</a>
      <a href="index.html" class="back">← Home</a>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <span class="eyebrow">Waitlist</span>
      <h1>Guidify</h1>
      <p class="lede"><span class="placeholder">[Placeholder: one-line description of Guidify, to be confirmed by the owner]</span></p>
      <form action="#" method="post" onsubmit="return false;">
        <label for="email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Email</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" required>
        <button type="submit" class="btn">Join waitlist</button>
      </form>
      <p class="fine">No spam. Unsubscribe at any time.</p>
    </section>
  </main>

  <footer>
    <div class="wrap">© 2026 Guidify. All rights reserved.</div>
  </footer>
</body>
</html>
